name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly-published CVEs
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:

  # ── 1. Secret Scanning ────────────────────────────────────────────────────────
  # Scans the full git history for hardcoded credentials, API keys, and tokens.
  # Catches accidental commits of .env files, credentials.json, private keys, etc.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required — gitleaks scans every commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Dependency Review (PRs only) ──────────────────────────────────────────
  # Compares the dependency diff introduced by a PR and blocks merging if it
  # introduces a package with a known high/critical vulnerability.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
