name: PR Preview — Firebase Hosting

on:
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to minimum required for posting PR comments.
permissions:
  contents: read

jobs:
  preview:
    name: Deploy Preview Channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # post preview URL as PR comment
      checks: write         # update check status
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Vite build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # Deploys to a temporary preview channel and posts the URL as a PR comment
      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:              webeng-final-project-a2e02
          expires:                7d
