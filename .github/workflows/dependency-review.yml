name: Dependency Review

# Blocks merging PRs that introduce packages with known high/critical CVEs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # post summary comment on the PR

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Post a markdown summary as a PR comment so reviewers can see affected packages
          comment-summary-in-pr: always
